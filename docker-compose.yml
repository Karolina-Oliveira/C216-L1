services:
  db:
    image: postgres:16-alpine
    container_name: alunos-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alunos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alunos_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: alunos-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/alunos_db
    ports:
      - "8000:8000"
    volumes:
      - ./pratica_5:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./pratica_6/frontend
    container_name: alunos-frontend
    ports:
     - "3000:3000"
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000


  tests:
    build: .
    container_name: alunos-tests
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/alunos_db
    volumes:
      - ./pratica_5:/app
    command: pytest -v

volumes:
  postgres_data:
